# Two GLOBAL SERVICES — each cluster publishes one backend, so each direction is
# independently testable and the response identifies the remote cluster.
#
# Apply the SAME file to BOTH clusters:
#   kubectl --context kind-cmtc-a -n mesh-example apply -f examples/apps/clustermesh/global-service.yaml
#   kubectl --context kind-cmtc-b -n mesh-example apply -f examples/apps/clustermesh/global-service.yaml
#
# HOW IT WORKS. Cilium watches Services carrying `service.cilium.io/global: "true"` and merges
# matching endpoint sets across the mesh. `rebel-base-cmtc-a` selects only the cmtc-a backend and
# `rebel-base-cmtc-b` only the cmtc-b backend. A client in either cluster can call both; the
# opposite-cluster response proves that ClusterMesh selected a remote endpoint.
#
# The distinct response body makes the serving cluster visible in saved test and load evidence.
apiVersion: v1
kind: Service
metadata:
  name: rebel-base-cmtc-a
  annotations:
    # THE ONE ANNOTATION THAT MATTERS. Without it this is an ordinary, cluster-local Service and
    # the mesh is irrelevant to it -- being in a mesh does not make every Service global, which is
    # the right default: sharing is opt-in, per Service.
    service.cilium.io/global: "true"
spec:
  type: ClusterIP
  ports:
    - {name: http, port: 80, targetPort: 80}
    - {name: app-alt, port: 8080, targetPort: 8080}
    - {name: app-high, port: 31337, targetPort: 31337}
  selector:
    name: rebel-base
    mesh.cmtc.io/cluster: cmtc-a
---
apiVersion: v1
kind: Service
metadata:
  name: rebel-base-cmtc-b
  annotations:
    service.cilium.io/global: "true"
spec:
  type: ClusterIP
  ports:
    - {name: http, port: 80, targetPort: 80}
    - {name: app-alt, port: 8080, targetPort: 8080}
    - {name: app-high, port: 31337, targetPort: 31337}
  selector:
    name: rebel-base
    mesh.cmtc.io/cluster: cmtc-b
