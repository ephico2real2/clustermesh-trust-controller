groups:
- name: cmtc.recording
  rules:
  # Enrollment labels from any actor over non-platform namespaces. A label ratio, not protection coverage.
  - record: cmtc:namespace_enrollment_label:ratio
    expr: sum by (cluster) (cmtc_namespaces_enrolled{job="cmtc",component="cmtc-controller"}) / (sum by (cluster) (cmtc_namespaces_eligible{job="cmtc",component="cmtc-controller"}) > 0)
  # Planned inputs: empty until the enforcement verifier exports all three exclusive states.
  - record: cmtc:pod_protection_coverage:ratio
    expr: sum by (cluster) (cmtc_pods_protected) / ((sum by (cluster) (cmtc_pods_protected) + sum by (cluster) (cmtc_pods_pending) + sum by (cluster) (cmtc_pods_enforcement_failed)) > 0)
  # Planned ztunnel collector; no handshakes in the window means no ratio, never 0 %.
  - record: cmtc:ztunnel_tls_handshake_success:ratio_rate5m
    expr: (sum by (cluster) (rate(istio_tls_handshakes_total{job="ztunnel",result="success"}[5m])) or on(cluster) (0 * sum by (cluster) (rate(istio_tls_handshakes_total{job="ztunnel"}[5m])))) / (sum by (cluster) (rate(istio_tls_handshakes_total{job="ztunnel"}[5m])) > 0)
  - record: cmtc:ztunnel_tls_handshake_p95_seconds:rate5m
    expr: histogram_quantile(0.95, sum by (cluster, le) (rate(istio_tls_handshake_duration_seconds_bucket{job="ztunnel"}[5m]))) and on(cluster) (sum by (cluster) (rate(istio_tls_handshake_duration_seconds_bucket{job="ztunnel",le="+Inf"}[5m])) > 0)
