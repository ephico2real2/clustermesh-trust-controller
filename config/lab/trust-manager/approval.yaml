# approver-policy (config/lab-pki/root-control.yaml explains it): trust-manager's chart creates a self-signed Issuer and
# its webhook Certificate in cert-manager. cert-manager's controller may get that one serving certificate from it.
# No maxDuration: approver-policy denies a request without a duration when one is set, and this Certificate names none
# (cert-manager's default, 90 days, applies).
# Apply this before installing trust-manager: kubectl apply -f config/lab/trust-manager/approval.yaml
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata: {name: trust-manager-webhook}
spec:
  allowed:
    isCA: false
    commonName: {value: trust-manager.cert-manager.svc, required: true}
    dnsNames: {values: [trust-manager.cert-manager.svc], required: true}
    usages: [digital signature, key encipherment, server auth]
  selector:
    issuerRef: {name: trust-manager, kind: Issuer, group: cert-manager.io}
    namespace: {matchNames: [cert-manager]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: trust-manager-webhook-policy}
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    verbs: [use]
    resourceNames: [trust-manager-webhook]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: trust-manager-webhook-policy}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: trust-manager-webhook-policy}
subjects:
  - {kind: ServiceAccount, name: cert-manager, namespace: cert-manager}
