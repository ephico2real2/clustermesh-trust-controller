# kind-cmtc-a: the CMTC chart with the issuer approval arbiter and the node trust report (ADR-012), for the live
# qualification in docs/development/ARBITER_QUALIFICATION_RUNBOOK.md. UIDs and pins were read from the lab on
# 2026-10-27 (kubectl get, read-only). The image digest is set on the command line from the CI image lock.
clusterName: cmtc-a
namespace:
  create: false
# The labs' SPIFFE trust objects (Certificate cmtc-a-spire-intermediate, Bundle cmtc-mesh-root) were created by
# scripts/lab/pki/mesh-pki.sh and the cmtc-trust release before this chart owned them; they are not adopted here.
trust:
  enabled: false
controller:
  issuerProfile:
    enabled: true
    # The approval the producer published before the arbiter existed; the arbiter adopts it (adoptSource).
    source: cmtc-issuer-approval-g6
    sourceUID: e8320c32-79ff-4382-8702-78da8ef14567
    output: cmtc-issuer-publication
    outputUID: fbc7b3c2-00f1-4787-a149-fca76e274c4e
    rootSHA256: [6c12c7353967466f9177847c3c1e3c0acdb54af6eaef94b126f0449bf636275f]
    minimumGeneration: 6
    readers:
      - {namespace: kube-system, name: cilium}
  issuerApproval:
    enabled: true
    clusters:
      - name: cmtc-a
        trustDomain: cmtc-a.mesh.example
        certificateUID: 2935a275-f8d9-4dc0-be9a-1dc05ddece31
      - name: cmtc-b
        trustDomain: cmtc-b.mesh.example
        certificateUID: 9e6d7081-af84-4f6d-a89f-eab1b15b8554
        peerSecret: cmtc-peer-cmtc-b
    peerReader:
      enabled: true
nodeAgent:
  trustReport:
    enabled: true
    # managePins stays off (the chart default): every node's pins file also holds the retired Lab Org Root
    # (0c28af9e…), which a managing agent refuses to keep (WriteFailed), and no root change is planned.
