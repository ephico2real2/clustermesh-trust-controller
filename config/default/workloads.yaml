apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmtc-controller
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cmtc-controller}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmtc-controller
        security.cmtc.io/metrics: "true"
    spec:
      serviceAccountName: cmtc-controller
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: controller
          image: cmtc:dev
          imagePullPolicy: IfNotPresent
          args: [--mode=controller, --cluster-name=CLUSTER_NAME]
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cmtc-node-agent
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: cmtc-node-agent}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmtc-node-agent
        security.cmtc.io/metrics: "true"
    spec:
      serviceAccountName: cmtc-node-agent
      tolerations: [{operator: Exists}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: cmtc:dev
          imagePullPolicy: IfNotPresent
          args: [--mode=node, --cluster-name=CLUSTER_NAME]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
---
apiVersion: v1
kind: Service
metadata:
  name: cmtc-controller
spec:
  selector: {app.kubernetes.io/name: cmtc-controller}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cmtc-metrics
spec:
  podSelector: {matchLabels: {security.cmtc.io/metrics: "true"}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cmtc-system}}
      ports: [{port: 8080, protocol: TCP}]
