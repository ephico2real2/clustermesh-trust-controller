apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmtc-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmtc-node-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmtc-controller
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [security.cmtc.io]
    resources: [namespacemtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [security.cmtc.io]
    resources: [namespacemtlspolicies/status]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmtc-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cmtc-controller
subjects:
  - kind: ServiceAccount
    name: cmtc-controller
    namespace: cmtc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmtc-leader-election
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmtc-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cmtc-leader-election
subjects:
  - kind: ServiceAccount
    name: cmtc-controller
    namespace: cmtc-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cmtc-node-agent
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # The measurement plane measures the Pods of enrolled namespaces (label io.cilium/mtls-enabled=true).
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cmtc-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cmtc-node-agent
subjects:
  - kind: ServiceAccount
    name: cmtc-node-agent
    namespace: cmtc-system
