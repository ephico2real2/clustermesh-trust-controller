# Applied to every cluster after Secret cert-manager/${PREFIX}-mesh-root-ca exists there. The cluster signs its own
# ClusterMesh intermediate from the shared root; the intermediate's key is generated in this cluster. Every
# per-cluster CA object is named after its cluster, so a certificate shows which cluster's CA signed it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: ${PREFIX}-mesh-root}
spec:
  ca: {secretName: ${PREFIX}-mesh-root-ca}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: ${CLUSTER}-clustermesh-intermediate, namespace: cert-manager}
spec:
  isCA: true
  commonName: ${CLUSTER} ClusterMesh intermediate CA
  # 3 years, as Cilium's own CA (tls.ca.certValidityDuration 1095); renewed 1 year early, which covers the longest
  # certificate it signs: ClusterMesh leaves (365 days).
  duration: 26280h    # 3 years
  renewBefore: 8760h  # 1 year
  secretName: ${CLUSTER}-clustermesh-intermediate
  # Nothing pins the intermediate key, so cert-manager's default of a new key per renewal is kept.
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef: {name: ${PREFIX}-mesh-root, kind: ClusterIssuer, group: cert-manager.io}
