# The mesh root (ADR-011). Rendered by scripts/lab/pki/mesh-pki.sh and applied to the control cluster only.
# rotationPolicy Never: a renewal keeps the root key when the existing key is intact. The renewed certificate must
# still reach every copied Secret and trust bundle before the old one expires.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: ${PREFIX}-mesh-root-bootstrap, namespace: cert-manager}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: ${PREFIX}-mesh-root-ca, namespace: cert-manager}
spec:
  isCA: true
  commonName: ${PREFIX} mesh root CA
  # Lifetimes nest: each CA renews at least one full lifetime of what it signs before it expires, so no chain
  # outlives its issuer (ADR-011, Lifetimes). Root 10 years, renewed 3 years early = one intermediate lifetime.
  duration: 87600h    # 10 years
  renewBefore: 26280h # 3 years
  secretName: ${PREFIX}-mesh-root-ca
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Never}
  issuerRef: {name: ${PREFIX}-mesh-root-bootstrap, kind: Issuer, group: cert-manager.io}
---
# cert-manager approver-policy: with cert-manager's auto-approval off (disableAutoApproval), a CertificateRequest is
# signed only when a policy allows it and its requester is bound to that policy (verb use). cert-manager's controller
# requests for every Certificate object; from this issuer it may get the mesh root only.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata: {name: ${PREFIX}-mesh-root-ca}
spec:
  allowed:
    isCA: true
    commonName: {value: "${PREFIX} mesh root CA", required: true}
    usages: [digital signature, key encipherment, cert sign, crl sign]
  constraints: {maxDuration: 87600h}
  selector:
    issuerRef: {name: ${PREFIX}-mesh-root-bootstrap, kind: Issuer, group: cert-manager.io}
    namespace: {matchNames: [cert-manager]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: ${PREFIX}-mesh-root-ca-policy}
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    verbs: [use]
    resourceNames: [${PREFIX}-mesh-root-ca]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: ${PREFIX}-mesh-root-ca-policy}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ${PREFIX}-mesh-root-ca-policy}
subjects:
  - {kind: ServiceAccount, name: cert-manager, namespace: cert-manager}
