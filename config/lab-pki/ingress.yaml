# Applied to every cluster with clustermesh.yaml. The cluster's Ingress intermediate: it signs the serving certificates
# of that cluster's Ingresses (the observability hub's receiver and Grafana), apart from the ClusterMesh leaves, so either
# signer can be renewed or replaced alone (ADR-011 decision 3: one intermediate per purpose, named after its cluster).
# Clients outside the cluster verify these leaves against the mesh root; the leaf's Secret carries the intermediate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: ${CLUSTER}-ingress-intermediate, namespace: cert-manager}
spec:
  isCA: true
  commonName: ${CLUSTER} Ingress intermediate CA
  # 3 years, renewed 1 year early, as the other intermediates (ADR-011, Lifetimes); its leaves are cert-manager's
  # default 90 days.
  duration: 26280h    # 3 years
  renewBefore: 8760h  # 1 year
  secretName: ${CLUSTER}-ingress-intermediate
  # Nothing pins the intermediate key, so cert-manager's default of a new key per renewal is kept.
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef: {name: ${PREFIX}-mesh-root, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: ${CLUSTER}-ingress-intermediate}
spec:
  ca: {secretName: ${CLUSTER}-ingress-intermediate}
