# SPIRE's intermediate, created at cluster setup so SPIRE can be installed later without a PKI step. SPIRE's
# UpstreamAuthority "cert-manager" requests its own 24-hour X509 CA from ${CLUSTER}-spire-intermediate, one CA level below
# this intermediate; cert-manager sets no path length limit on isCA certificates, so that level is allowed.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: ${CLUSTER}-spire-intermediate, namespace: cert-manager}
spec:
  isCA: true
  commonName: ${CLUSTER} SPIRE intermediate CA
  # 3 years, as Cilium's own CA (tls.ca.certValidityDuration 1095); renewed 1 year early, which covers the longest
  # certificate it signs: SPIRE's X509 CA.
  duration: 26280h    # 3 years
  renewBefore: 8760h  # 1 year
  secretName: ${CLUSTER}-spire-intermediate
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef: {name: ${PREFIX}-mesh-root, kind: ClusterIssuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: {name: ${CLUSTER}-spire-intermediate}
spec:
  ca: {secretName: ${CLUSTER}-spire-intermediate}
