# Proposed API only
apiVersion: security.cmtc.io/v1alpha1
kind: ClusterMeshTrust
metadata:
  name: production-mesh
spec:
  # Example SPIFFE identity realm, not an application DNS suffix or cluster ID.
  # Matching this string does not establish trust; verified SVIDs and bundles do.
  # Per-cluster identity/issuer binding remains a CMTC-105 design gate.
  trustDomain: mesh.example.com
  identity:
    provider: spire
    clusterScopedIntermediates: true
  certificateAuthority:
    upstreamProvider: cert-manager
    rootBundleRef:
      name: mesh-root-bundle
  clusters:
    - name: cluster-a
    - name: cluster-b
  distribution:
    provider: trust-manager
  rotation:
    strategy: Staged
    requireAllClustersReady: true
  networkEncryption:
    management: Observe
    # Primary layered profile: ztunnel workload mTLS plus one required transport.
    # Illustrative contract only; schema and enforcement are not implemented.
    required: true
    permittedModes: [wireguard, ipsec]
