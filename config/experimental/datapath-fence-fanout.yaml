{
  "apiVersion": "apps/v1",
  "kind": "DaemonSet",
  "metadata": {
    "name": "cmtc-bpf-fence",
    "namespace": "cmtc-system"
  },
  "spec": {
    "updateStrategy": {
      "type": "OnDelete"
    },
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "cmtc-bpf-fence"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "cmtc-bpf-fence",
          "security.cmtc.io/metrics": "true"
        }
      },
      "spec": {
        "hostNetwork": true,
        "automountServiceAccountToken": false,
        "nodeSelector": {
          "security.cmtc.io/bpf-fence-lab": "true"
        },
        "tolerations": [
          {
            "operator": "Exists"
          }
        ],
        "terminationGracePeriodSeconds": 10,
        "containers": [
          {
            "name": "fence",
            "image": "IMAGE_NOT_BUILT",
            "imagePullPolicy": "Never",
            "command": [
              "/cmtc-bpf-fence"
            ],
            "args": [
              "--config=/config/$(NODE_NAME).json",
              "--metrics-listen=$(NODE_IP):18084"
            ],
            "env": [
              {
                "name": "NODE_NAME",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "spec.nodeName"
                  }
                }
              },
              {
                "name": "NODE_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.hostIP"
                  }
                }
              },
              {
                "name": "CLUSTER_NAME",
                "value": "CLUSTER_NAME"
              },
              {
                "name": "CMTC_FENCE_CONFIG",
                "value": "/config/$(NODE_NAME).json"
              },
              {
                "name": "CMTC_FENCE_POD_UID",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.uid"
                  }
                }
              }
            ],
            "securityContext": {
              "privileged": true,
              "runAsUser": 0,
              "readOnlyRootFilesystem": true
            },
            "resources": {
              "requests": {
                "cpu": "10m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "200m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/config",
                "readOnly": true
              },
              {
                "name": "pins",
                "mountPath": "/cmtc-pins",
                "subPathExpr": "$(NODE_NAME)"
              },
              {
                "name": "locks",
                "mountPath": "/cmtc-locks",
                "subPathExpr": "$(NODE_NAME)"
              }
            ],
            "startupProbe": {
              "exec": {
                "command": [
                  "/cmtc-bpf-fence",
                  "--health-check=live"
                ]
              },
              "timeoutSeconds": 3,
              "periodSeconds": 1,
              "failureThreshold": 30
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "/cmtc-bpf-fence",
                  "--health-check=ready"
                ]
              },
              "timeoutSeconds": 3,
              "periodSeconds": 2,
              "failureThreshold": 1
            },
            "livenessProbe": {
              "exec": {
                "command": [
                  "/cmtc-bpf-fence",
                  "--health-check=live"
                ]
              },
              "timeoutSeconds": 3,
              "periodSeconds": 5,
              "failureThreshold": 3
            },
            "ports": [
              {
                "name": "metrics",
                "containerPort": 18084,
                "protocol": "TCP"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "cmtc-bpf-fence-RUN"
            }
          },
          {
            "name": "pins",
            "hostPath": {
              "path": "/sys/fs/bpf/cmtc-fence-RUN",
              "type": "Directory"
            }
          },
          {
            "name": "locks",
            "hostPath": {
              "path": "/run/cmtc-fence-RUN",
              "type": "Directory"
            }
          }
        ]
      }
    }
  }
}
