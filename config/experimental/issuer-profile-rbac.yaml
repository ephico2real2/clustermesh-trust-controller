# Optional only; not included in config/default. Both objects must be
# pre-created by an administrator and their actual UIDs pinned in deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmtc-issuer-profile-producer
  namespace: cmtc-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cmtc-issuer-approval]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cmtc-issuer-publication]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmtc-issuer-profile-producer
  namespace: cmtc-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cmtc-issuer-profile-producer
subjects:
  - kind: ServiceAccount
    name: cmtc-controller
    namespace: cmtc-system
