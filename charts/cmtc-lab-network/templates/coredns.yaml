{{- if .Values.coredns.enabled }}
# kubeadm's ConfigMap, taken over by this release. The first server block is kubeadm's default Corefile for CoreDNS
# v1.14.2, byte for byte as kind created it on both labs (sha256 22847ad9af74…, 2026-10-28); each zone adds a block.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    {{- range .Values.coredns.zones }}
    {{ .domain }}:53 {
        errors
        # A: the zone's address for the domain and every name under it. Any other type: no data, not SERVFAIL, so
        # a resolver that asks for A and AAAA together still gets the A answer.
        template IN A {{ .domain }} {
            answer "{{ "{{ .Name }}" }} 60 IN A {{ .address }}"
        }
        template ANY ANY {{ .domain }} {
            rcode NOERROR
        }
        prometheus :9153
        cache 30
        reload
    }
    {{- end }}
{{- end }}
