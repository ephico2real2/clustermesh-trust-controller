{{- $address := required "ingress.address is required: this cluster's Ingress address" .Values.ingress.address }}
# The pool holds one address and selects only Cilium's Ingress Service, so no other LoadBalancer Service gets an
# address from it, and the Ingress Service always gets the same one.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: cmtc-ingress
  labels:
    {{- include "cmtc-lab-network.labels" . | nindent 4 }}
spec:
  blocks:
    - start: {{ $address | quote }}
      stop: {{ $address | quote }}
  serviceSelector:
    matchLabels:
      cilium.io/ingress: "true"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: cmtc-ingress
  labels:
    {{- include "cmtc-lab-network.labels" . | nindent 4 }}
spec:
  serviceSelector:
    matchLabels:
      cilium.io/ingress: "true"
  interfaces:
    {{- toYaml .Values.ingress.interfaces | nindent 4 }}
  loadBalancerIPs: true
