{{- $report := .Values.nodeAgent.trustReport }}
{{- $roots := $report.rootSHA256 | default .Values.controller.issuerProfile.rootSHA256 }}
{{- if and $report.enabled $report.managePins (not $roots) }}{{ fail "nodeAgent.trustReport.managePins needs rootSHA256 (or controller.issuerProfile.rootSHA256)" }}{{ end -}}
{{- range $roots }}{{ if not (regexMatch "^[0-9a-f]{64}$" .) }}{{ fail (printf "nodeAgent.trustReport.rootSHA256 entry %q is not 64 lowercase hex characters" .) }}{{ end }}{{ end -}}
{{- $measurement := include "cmtc.measurement" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cmtc-node-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmtc.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: cmtc-node-agent}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmtc-node-agent
        security.cmtc.io/metrics: "true"
    spec:
      serviceAccountName: cmtc-node-agent
      # Only the agent gets an API token, through the api-token volume; the measurement loader has none (ADR-005).
      automountServiceAccountToken: false
      {{- with .Values.nodeAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- if $report.enabled }}
        {{- /* The pins file and ztunnel's checkpoint are root-owned (0600): uid 0 reads them, with no capability; the
             administrator's other podSecurityContext keys still apply. On OpenShift this needs an SCC that allows uid 0. */}}
        {{- $root := mergeOverwrite (deepCopy .Values.podSecurityContext) (dict "runAsUser" 0 "runAsNonRoot" false) }}
        {{- include "cmtc.podSecurityContext" (dict "Values" (dict "podSecurityContext" $root "global" .Values.global)) | nindent 8 }}
        {{- else }}
        {{- include "cmtc.podSecurityContext" . | nindent 8 }}
        {{- end }}
      containers:
        - name: agent
          image: {{ include "cmtc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            - --cluster-name={{ include "cmtc.clusterName" . }}
            {{- if $report.enabled }}
            - --node-trust-report=true
            - --pins-dir={{ $report.pinsDir }}
            - --checkpoint-dir={{ $report.checkpointDir }}
            {{- if $report.managePins }}
            - --manage-pins=true
            - --node-root-sha256={{ $roots | join "," }}
            {{- end }}
            {{- end }}
            {{- if $measurement }}
            - --measurement-desired-dir=/run/cmtc/desired
            - --measurement-snapshot-dir=/run/cmtc/snapshot
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          resources:
            {{- toYaml .Values.nodeAgent.resources | nindent 12 }}
          securityContext:
            {{- include "cmtc.securityContext" . | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          volumeMounts:
            - {name: api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            {{- if $report.enabled }}
            - {name: issuer-pins, mountPath: {{ $report.pinsDir }}, readOnly: {{ not $report.managePins }}}
            - {name: issuer-checkpoint, mountPath: {{ $report.checkpointDir }}, readOnly: true}
            {{- end }}
            {{- if $measurement }}
            - {name: measurement-desired, mountPath: /run/cmtc/desired}
            - {name: measurement-snapshot, mountPath: /run/cmtc/snapshot, readOnly: true}
            {{- end }}
        {{- if $measurement }}
        # The eBPF measurement loader (ADR-005): root with CAP_BPF and CAP_NET_ADMIN only, no API token and no
        # listener; it refuses to start with anything more. Its readiness is the agent's cmtc_measurement_ready metric.
        # This security context is fixed: the securityContext value does not apply to it.
        - name: measurement-loader
          image: {{ include "cmtc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/cmtc-measure]
          args: [--cgroup-root=/host/cgroup, --desired-dir=/run/cmtc/desired, --snapshot-dir=/run/cmtc/snapshot]
          resources:
            {{- toYaml .Values.nodeAgent.measurement.resources | nindent 12 }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [BPF, NET_ADMIN]}
          volumeMounts:
            - {name: host-cgroup, mountPath: /host/cgroup, readOnly: true}
            - {name: measurement-desired, mountPath: /run/cmtc/desired, readOnly: true}
            - {name: measurement-snapshot, mountPath: /run/cmtc/snapshot}
        {{- end }}
      volumes:
        # The token, CA and namespace that kubelet would mount into every container, for the agent alone.
        - name: api-token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3607}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI: {items: [{path: namespace, fieldRef: {apiVersion: v1, fieldPath: metadata.namespace}}]}
        {{- if $report.enabled }}
        - name: issuer-pins
          hostPath: {path: {{ $report.pinsDir }}, type: Directory}
        - name: issuer-checkpoint
          hostPath: {path: {{ $report.checkpointDir }}, type: Directory}
        {{- end }}
        {{- if $measurement }}
        - name: host-cgroup
          hostPath: {path: /sys/fs/cgroup, type: Directory}
        # The agent writes the desired list into one and the loader writes its snapshot into the other.
        - name: measurement-desired
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        - name: measurement-snapshot
          emptyDir: {medium: Memory, sizeLimit: 8Mi}
        {{- end }}
