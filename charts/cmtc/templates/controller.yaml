{{- $issuer := .Values.controller.issuerProfile }}
{{- $approval := .Values.controller.issuerApproval }}
{{- if $issuer.enabled }}
{{-   if not $issuer.rootSHA256 }}
{{-     fail "controller.issuerProfile.rootSHA256 needs at least one root pin" }}
{{-   end }}
{{-   range $issuer.rootSHA256 }}
{{-     if not (regexMatch "^[0-9a-f]{64}$" .) }}
{{-       fail (printf "controller.issuerProfile.rootSHA256 entry %q is not 64 lowercase hex characters" .) }}
{{-     end }}
{{-   end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cmtc-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmtc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: cmtc-controller}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmtc-controller
        security.cmtc.io/metrics: "true"
    spec:
      serviceAccountName: cmtc-controller
      securityContext:
        {{- include "cmtc.podSecurityContext" . | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "cmtc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=controller
            - --cluster-name={{ include "cmtc.clusterName" . }}
            {{- if $issuer.enabled }}
            - --issuer-profile-producer=true
            - --issuer-profile-namespace={{ .Release.Namespace }}
            {{- if not $approval.enabled }}
            - --issuer-profile-source={{ $issuer.source }}
            {{- end }}
            - --issuer-profile-output={{ $issuer.output }}
            {{- if not $approval.enabled }}
            - --issuer-profile-source-uid={{ required "controller.issuerProfile.sourceUID is required" $issuer.sourceUID }}
            {{- end }}
            - --issuer-profile-output-uid={{ required "controller.issuerProfile.outputUID is required" $issuer.outputUID }}
            - --issuer-profile-root-sha256={{ $issuer.rootSHA256 | join "," }}
            - --issuer-profile-minimum-generation={{ $issuer.minimumGeneration }}
            {{- if $approval.enabled }}
            - --issuer-approval-config=/etc/cmtc/issuer-approval/config.json
            {{- end }}
            {{- end }}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            {{- include "cmtc.securityContext" . | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: health}}
          livenessProbe: {httpGet: {path: /healthz, port: health}}
          {{- if $approval.enabled }}
          volumeMounts:
            - {name: issuer-approval-config, mountPath: /etc/cmtc/issuer-approval, readOnly: true}
            {{- range $approval.clusters }}
            {{- if .peerSecret }}
            - {name: peer-{{ .name }}, mountPath: /etc/cmtc/peers/{{ .name }}, readOnly: true}
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if $approval.enabled }}
      volumes:
        - name: issuer-approval-config
          configMap: {name: cmtc-issuer-approval-config}
        {{- range $approval.clusters }}
        {{- if .peerSecret }}
        - name: peer-{{ .name }}
          secret: {secretName: {{ .peerSecret }}, items: [{key: kubeconfig, path: kubeconfig}]}
        {{- end }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cmtc-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmtc.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: cmtc-controller}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
