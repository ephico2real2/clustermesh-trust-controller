{{- if .Values.trust.enabled }}
{{- /* Fail early, with a clear message, when the APIs of the objects below are not installed. */ -}}
{{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1/Certificate") }}{{ fail "trust.enabled needs cert-manager installed first (no cert-manager.io/v1 Certificate API)" }}{{ end -}}
{{- if not (.Capabilities.APIVersions.Has "trust.cert-manager.io/v1alpha1/Bundle") }}{{ fail "trust.enabled needs cert-manager and trust-manager installed first (no trust.cert-manager.io/v1alpha1 Bundle API)" }}{{ end -}}
{{- $cluster := include "cmtc.clusterName" . -}}
{{- $intermediate := printf "%s-spire-intermediate" $cluster -}}
{{- if not .Values.trust.bundle.namespaceLabels }}{{ fail "trust.bundle.namespaceLabels must name at least one label" }}{{ end -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $intermediate }}
  namespace: {{ .Values.trust.certManagerNamespace }}
  labels:
    {{- include "cmtc.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $cluster }} SPIRE intermediate CA
  duration: {{ .Values.trust.spireIntermediate.duration }}
  renewBefore: {{ .Values.trust.spireIntermediate.renewBefore }}
  secretName: {{ $intermediate }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: {{ .Values.trust.rootIssuer }}
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $intermediate }}
  labels:
    {{- include "cmtc.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $intermediate }}
---
# Cluster-scoped: a Bundle has no namespace. trust-manager v0.25.0 serves trust.cert-manager.io/v1alpha1 only; its
# announced successor, ClusterBundle (trust-manager.io/v1alpha2), is not in that release.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ .Values.trust.bundle.name }}
  labels:
    {{- include "cmtc.labels" . | nindent 4 }}
spec:
  sources:
    - secret:
        name: {{ $intermediate | quote }}
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        {{- range $key, $value := .Values.trust.bundle.namespaceLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
{{- with .Values.trust.approval }}
{{- if .enabled }}
{{- if not ($.Capabilities.APIVersions.Has "policy.cert-manager.io/v1alpha1/CertificateRequestPolicy") }}{{ fail "trust.approval.enabled needs cert-manager approver-policy installed first (no policy.cert-manager.io/v1alpha1 CertificateRequestPolicy API)" }}{{ end -}}
{{- if not .spire.trustDomain }}{{ fail "trust.approval.spire.trustDomain is required" }}{{ end -}}
{{- $spireCA := printf "%s-spire-ca" $cluster }}
---
# From the mesh root, cert-manager's controller may get this cluster's SPIRE intermediate only.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ $intermediate }}
  labels:
    {{- include "cmtc.labels" $ | nindent 4 }}
spec:
  allowed:
    isCA: true
    commonName: {value: {{ printf "%s SPIRE intermediate CA" $cluster | quote }}, required: true}
    usages: [digital signature, key encipherment, cert sign, crl sign]
  constraints: {maxDuration: {{ $.Values.trust.spireIntermediate.duration }}}
  selector:
    issuerRef: {name: {{ $.Values.trust.rootIssuer }}, kind: ClusterIssuer, group: cert-manager.io}
    namespace: {matchNames: [{{ $.Values.trust.certManagerNamespace }}]}
---
# From the SPIRE intermediate, only the SPIRE server may get a CA, and only for its own trust domain.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ $spireCA }}
  labels:
    {{- include "cmtc.labels" $ | nindent 4 }}
spec:
  allowed:
    isCA: true
    commonName: {value: {{ .spire.caSubject.commonName | default (printf "%s SPIRE CA" $cluster) | quote }}, required: true}
    uris: {values: [{{ printf "spiffe://%s" .spire.trustDomain | quote }}], required: true}
    subject:
      organizations: {values: [{{ .spire.caSubject.organization | quote }}]}
      countries: {values: [{{ .spire.caSubject.country | quote }}]}
      # SPIRE sets the subject serialNumber to the CA certificate's random serial number.
      serialNumber: {value: "*"}
    usages: [cert sign, crl sign]
  constraints: {maxDuration: {{ .spire.caMaxDuration }}}
  selector:
    issuerRef: {name: {{ $intermediate }}, kind: ClusterIssuer, group: cert-manager.io}
    namespace: {matchNames: [{{ .spire.serviceAccount.namespace }}]}
{{- range $policy, $account := dict $intermediate .certManagerServiceAccount $spireCA .spire.serviceAccount }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $policy }}-policy
  labels:
    {{- include "cmtc.labels" $ | nindent 4 }}
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    verbs: [use]
    resourceNames: [{{ $policy }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $policy }}-policy
  labels:
    {{- include "cmtc.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $policy }}-policy}
subjects:
  - {kind: ServiceAccount, name: {{ $account.name }}, namespace: {{ $account.namespace }}}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
