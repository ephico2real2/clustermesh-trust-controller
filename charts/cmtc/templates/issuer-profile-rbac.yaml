{{- $issuer := .Values.controller.issuerProfile }}
{{- if $issuer.enabled }}
# Access only to the two named ConfigMaps. The chart never creates them: an administrator does, and their UIDs are
# pinned in the controller's arguments.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmtc-issuer-profile-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmtc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $issuer.source | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $issuer.output | quote }}]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmtc-issuer-profile-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cmtc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cmtc-issuer-profile-access
subjects:
  - kind: ServiceAccount
    name: cmtc-controller
    namespace: {{ .Release.Namespace }}
{{- with $issuer.readers }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmtc-issuer-profile-readers
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cmtc.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $issuer.source | quote }}, {{ $issuer.output | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmtc-issuer-profile-readers
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "cmtc.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cmtc-issuer-profile-readers
subjects:
  {{- range . }}
  - kind: ServiceAccount
    name: {{ required "issuerProfile.readers[].name is required" .name }}
    namespace: {{ required "issuerProfile.readers[].namespace is required" .namespace }}
  {{- end }}
{{- end }}
{{- end }}
