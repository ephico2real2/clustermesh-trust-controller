global:
  # true on OpenShift. The Pods then leave runAsUser unset, so the restricted-v2 SCC assigns a UID from the namespace's
  # range (Red Hat image guidelines; SPIFFE's helm-charts-hardened does the same). The image runs as any non-root UID.
  # false keeps runAsUser 65532, the image's own user.
  openshift: false

# Required: the stable cluster name used in metric labels (--cluster-name).
clusterName: ""

image:
  repository: ghcr.io/ephico2real2/cmtc
  # Preferred: the digest from the images workflow's images.lock.json (sha256:...). Used before tag when set.
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent

namespace:
  # Creates the release namespace with security.cmtc.io/platform-protected=true, which keeps CMTC's own namespace out of
  # enrollment. Install with -n <namespace> and without --create-namespace. Set false only for a namespace that already
  # carries that label.
  create: true

crds:
  # Installs and upgrades the NamespaceMTLSPolicy CRD. Helm keeps it on uninstall.
  enabled: true

# Merged over the defaults: runAsNonRoot, seccompProfile RuntimeDefault, and runAsUser 65532 unless global.openshift.
podSecurityContext: {}
# Merged over the defaults: allowPrivilegeEscalation false, readOnlyRootFilesystem true, capabilities drop ALL.
securityContext: {}

controller:
  replicas: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
  # The opt-in issuer-profile producer. It never enables workload enforcement. An administrator creates the source and
  # output ConfigMaps first; their UIDs are pinned here, so a replaced object is refused.
  issuerProfile:
    enabled: false
    source: cmtc-issuer-approval
    sourceUID: ""
    output: cmtc-issuer-publication
    outputUID: ""
    # Installation-approved root certificate SHA-256 pins (hex).
    rootSHA256: []
    minimumGeneration: 1
    # ServiceAccounts allowed to read the source and the output, e.g. {namespace: kube-system, name: cilium}.
    readers: []

# The SPIFFE trust of this cluster (ADR-011, MESH_PKI.md "Trust bundle"): its SPIRE intermediate, signed by the mesh
# root, and the ConfigMap that carries the mesh root to the namespaces that verify mesh certificates. Needs cert-manager
# and trust-manager installed first (trust-manager installed without app.targetNamespaces).
trust:
  enabled: false
  # cert-manager's namespace: CA Secrets live here, and trust-manager reads Bundle sources from here (its trust
  # namespace).
  certManagerNamespace: cert-manager
  # The ClusterIssuer backed by the mesh root.
  # It must match the ClusterIssuer scripts/lab/pki/mesh-pki.sh creates: <prefix>-mesh-root (prefix cmtc by default).
  rootIssuer: cmtc-mesh-root
  # <clusterName>-spire-intermediate: a Certificate, its Secret and a ClusterIssuer of that name. SPIRE's UpstreamAuthority
  # "cert-manager" requests its own X509 CA from that ClusterIssuer.
  spireIntermediate:
    # 3 years, renewed 1 year early, which covers the longest certificate it signs (ADR-011, Lifetimes).
    duration: 26280h
    renewBefore: 8760h
  bundle:
    # The trust-manager Bundle, and the ConfigMap it writes (key ca.crt): the mesh root, read from the intermediate
    # Secret's ca.crt. Only that key is copied; trust-manager's watch still receives the whole Secret (ADR-011, Accepted
    # risk).
    name: cmtc-mesh-root
    # A namespace opts in with these labels, in its own manifest, only when a component in it verifies mesh certificates.
    namespaceLabels:
      trust: enabled

nodeAgent:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  tolerations:
    - operator: Exists

metrics:
  networkPolicy:
    enabled: true
    # Namespaces allowed to scrape port 8080, besides the release namespace. Empty selects the platform's monitoring:
    # monitoring on Kubernetes; openshift-monitoring and openshift-user-workload-monitoring on OpenShift.
    allowedNamespaces: []
