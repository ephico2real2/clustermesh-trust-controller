# The approver-policy policies of the mesh PKI that scripts/lab/pki/mesh-pki.sh builds (ADR-011). Install this chart in
# every cluster after cert-manager (disableAutoApproval=true) and approver-policy, and before mesh-pki.sh: with
# cert-manager's own approver off, a request is signed only when a CertificateRequestPolicy allows it and its requester is
# bound to that policy (verb use). mesh-pki.sh waits for its Certificates, so without these policies it times out.
# The SPIRE intermediate's policies are in the CMTC chart (charts/cmtc, trust.approval), beside that Certificate.

# Required: the cluster name in <clusterName>-clustermesh-intermediate.
clusterName: ""
# The prefix of the mesh root's names (mesh-pki.sh --prefix): <prefix>-mesh-root-bootstrap, <prefix>-mesh-root.
prefix: cmtc
# true only in the control cluster, which mints the root from <prefix>-mesh-root-bootstrap.
control: false

# cert-manager's namespace and controller ServiceAccount. The controller requests for every Certificate object, and the
# CA Certificates live in this namespace.
certManager:
  namespace: cert-manager
  serviceAccount: cert-manager

# A request may not ask for longer than these. Each equals its Certificate's duration in config/lab-pki.
root:
  maxDuration: 87600h
clusterMeshIntermediate:
  maxDuration: 26280h
# Leaves from <clusterName>-clustermesh-intermediate: the ClusterMesh API server certificates (Cilium chart,
# clustermesh.apiserver.tls.auto) and the ztunnel ADS, membership-writer and origin-reader certificates. No CA.
# A request must name its duration: the Cilium chart sets certValidityDuration; config/lab/cilium/ztunnel.yaml sets 24h.
clusterMeshLeaves:
  namespace: kube-system
  dnsNames: [clustermesh-apiserver.kube-system.svc, "*.mesh.cilium.io", localhost]
  ipAddresses: ["127.0.0.1", "::1"]
  usages: [digital signature, key encipherment, server auth, client auth]
  maxDuration: 8760h
