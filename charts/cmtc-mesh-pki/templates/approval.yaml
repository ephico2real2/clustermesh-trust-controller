{{- if not (.Capabilities.APIVersions.Has "policy.cert-manager.io/v1alpha1/CertificateRequestPolicy") }}{{ fail "cmtc-mesh-pki needs cert-manager approver-policy installed first (no policy.cert-manager.io/v1alpha1 CertificateRequestPolicy API)" }}{{ end -}}
{{- $cluster := required "clusterName is required" .Values.clusterName -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $cluster) }}{{ fail (printf "clusterName %q is not a DNS label" $cluster) }}{{ end -}}
{{- $prefix := .Values.prefix -}}
{{- $cm := .Values.certManager -}}
{{- $spire := .Values.spire -}}
{{- if not $spire.trustDomain }}{{ fail "spire.trustDomain is required" }}{{ end -}}
{{- $spireIntermediate := printf "%s-spire-intermediate" $cluster -}}
{{- /* Each policy, and the one requester bound to it (verb use). */ -}}
{{- $controller := dict "namespace" $cm.namespace "name" $cm.serviceAccount -}}
{{- $bindings := dict (printf "%s-clustermesh-intermediate" $cluster) $controller (printf "%s-clustermesh-leaves" $cluster) $controller
      $spireIntermediate $controller (printf "%s-spire-ca" $cluster) $spire.serviceAccount -}}
{{- if .Values.control }}
{{- $_ := set $bindings (printf "%s-mesh-root-ca" $prefix) $controller }}
# From the bootstrap Issuer, cert-manager's controller may get the mesh root only.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ $prefix }}-mesh-root-ca
  labels:
    {{- include "cmtc-mesh-pki.labels" . | nindent 4 }}
spec:
  allowed:
    isCA: true
    commonName: {value: {{ printf "%s mesh root CA" $prefix | quote }}, required: true}
    usages: [digital signature, key encipherment, cert sign, crl sign]
  constraints: {maxDuration: {{ .Values.root.maxDuration }}}
  selector:
    issuerRef: {name: {{ $prefix }}-mesh-root-bootstrap, kind: Issuer, group: cert-manager.io}
    namespace: {matchNames: [{{ $cm.namespace }}]}
---
{{- end }}
# From the mesh root, cert-manager's controller may get this cluster's ClusterMesh intermediate.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ $cluster }}-clustermesh-intermediate
  labels:
    {{- include "cmtc-mesh-pki.labels" . | nindent 4 }}
spec:
  allowed:
    isCA: true
    commonName: {value: {{ printf "%s ClusterMesh intermediate CA" $cluster | quote }}, required: true}
    usages: [digital signature, key encipherment, cert sign, crl sign]
  constraints: {maxDuration: {{ .Values.clusterMeshIntermediate.maxDuration }}}
  selector:
    issuerRef: {name: {{ $prefix }}-mesh-root, kind: ClusterIssuer, group: cert-manager.io}
    namespace: {matchNames: [{{ $cm.namespace }}]}
---
# From this cluster's ClusterMesh intermediate, cert-manager's controller may get the listed leaves, and no CA.
{{- with .Values.clusterMeshLeaves }}
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ $cluster }}-clustermesh-leaves
  labels:
    {{- include "cmtc-mesh-pki.labels" $ | nindent 4 }}
spec:
  allowed:
    isCA: false
    commonName: {value: "*", required: true}
    dnsNames: {values: {{ toJson .dnsNames }}}
    ipAddresses: {values: {{ toJson .ipAddresses }}}
    usages: {{ toJson .usages }}
  constraints: {maxDuration: {{ .maxDuration }}}
  selector:
    issuerRef: {name: {{ $cluster }}-clustermesh-intermediate, kind: ClusterIssuer, group: cert-manager.io}
    namespace: {matchNames: [{{ .namespace }}]}
{{- end }}
---
# From the mesh root, cert-manager's controller may get this cluster's SPIRE intermediate (the CMTC chart's trust.*).
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ $spireIntermediate }}
  labels:
    {{- include "cmtc-mesh-pki.labels" . | nindent 4 }}
spec:
  allowed:
    isCA: true
    commonName: {value: {{ printf "%s SPIRE intermediate CA" $cluster | quote }}, required: true}
    usages: [digital signature, key encipherment, cert sign, crl sign]
  constraints: {maxDuration: {{ .Values.spireIntermediate.maxDuration }}}
  selector:
    issuerRef: {name: {{ $prefix }}-mesh-root, kind: ClusterIssuer, group: cert-manager.io}
    namespace: {matchNames: [{{ $cm.namespace }}]}
---
# From the SPIRE intermediate, only the SPIRE server may get a CA, and only for its own trust domain: ztunnel trusts every
# CA that this intermediate signs.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ $cluster }}-spire-ca
  labels:
    {{- include "cmtc-mesh-pki.labels" . | nindent 4 }}
spec:
  allowed:
    isCA: true
    commonName: {value: {{ $spire.caSubject.commonName | default (printf "%s SPIRE CA" $cluster) | quote }}, required: true}
    uris: {values: [{{ printf "spiffe://%s" $spire.trustDomain | quote }}], required: true}
    subject:
      organizations: {values: [{{ $spire.caSubject.organization | quote }}]}
      countries: {values: [{{ $spire.caSubject.country | quote }}]}
      # SPIRE sets the subject serialNumber to the CA certificate's random serial number.
      serialNumber: {value: "*"}
    usages: [cert sign, crl sign]
  constraints: {maxDuration: {{ $spire.caMaxDuration }}}
  selector:
    issuerRef: {name: {{ $spireIntermediate }}, kind: ClusterIssuer, group: cert-manager.io}
    namespace: {matchNames: [{{ $spire.serviceAccount.namespace }}]}
{{- range $policy, $account := $bindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $policy }}-policy
  labels:
    {{- include "cmtc-mesh-pki.labels" $ | nindent 4 }}
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    verbs: [use]
    resourceNames: [{{ $policy }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $policy }}-policy
  labels:
    {{- include "cmtc-mesh-pki.labels" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $policy }}-policy}
subjects:
  - {kind: ServiceAccount, name: {{ $account.name }}, namespace: {{ $account.namespace }}}
{{- end }}
