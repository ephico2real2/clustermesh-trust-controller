# Isolated CMTC-101 traffic fixture, adapted from examples/apps/shop/10-lab.yaml.
# Enrollment is a separate explicit test step after the plaintext control.
apiVersion: v1
kind: Namespace
metadata:
  name: mtls-spike
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: client, namespace: mtls-spike}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: server, namespace: mtls-spike}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: server, namespace: mtls-spike}
spec:
  replicas: 1
  selector: {matchLabels: {app: mtls-server}}
  template:
    metadata: {labels: {app: mtls-server}}
    spec:
      serviceAccountName: server
      nodeSelector: {kubernetes.io/hostname: cmtc-mtls-control-plane}
      tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: server, namespace: mtls-spike}
spec:
  selector: {app: mtls-server}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: mtls-spike, labels: {app: mtls-client}}
spec:
  serviceAccountName: client
  nodeSelector: {kubernetes.io/hostname: cmtc-mtls-worker}
  securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: client
      image: alpine:3.20
      command: [sleep, '86400']
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
