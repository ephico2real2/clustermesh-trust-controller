name: CMTC build and deployed two-cluster lab
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
    inputs:
      cilium_image_lock_url:
        description: Optional immutable raw GitHub URL for another published fork image lock
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: cmtc-${{ github.ref }}
  cancel-in-progress: true
env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.10', cache: true}
      - run: make test build
      - name: Generated schema and formatting stay current
        run: |
          python3 scripts/generate-crd.py
          git diff --exit-code config/crd
          test -z "$(gofmt -l api internal cmd)"
          kubectl kustomize config/default > /tmp/cmtc-manifests.yaml
          bash -n scripts/cilium/*.sh
          python3 scripts/cilium/prepare.py config/cilium-images.lock.json /tmp/cilium-image-values.json
          python3 examples/observability/ztunnel-spike/validate.py
          python3 observability/build.py --check
          python3 observability/validate.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s observability -p 'test_*.py'
          bash -n scripts/lab/*.sh
          bash -n scripts/capture/publish.sh
          node --check scripts/capture/walk.cjs
          node --check scripts/capture/capture.mjs
          node scripts/capture/dashboard-spec.test.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/capture/test_load_timeline.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/capture/test_collect_frozen_load.py
      - name: Prometheus recording and alert semantics
        run: |
          docker run --rm --network none --memory 512m --cpus 1 \
            -v "$PWD/observability/prometheus:/rules:ro" -w /rules \
            --entrypoint /bin/promtool \
            prom/prometheus@sha256:0ccc219ac86c5f5dcd20fb1a8d0526f2c78efe012e3ca2f73d66379bab8f667a \
            test rules dashboard-semantics.test.json
  deployed-lab:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # per-run PNG/log folders on ci-captures, as in the reference lab
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Pinned tools with published checksum verification
        run: bash scripts/lab/ci-bootstrap.sh
      - name: Build Ubuntu capture image with Playwright, Chromium and OS libraries installed
        timeout-minutes: 10
        run: docker build -f scripts/capture/Dockerfile -t cmtc-capture:dev .
      - name: Build the actual CMTC image
        run: docker build -t cmtc:dev .
      - name: Record the built capture and CMTC image identities
        run: |
          mkdir -p artifacts
          python3 - <<'PYIMAGES'
          import json, os, subprocess
          images = []
          for tag in ('cmtc-capture:dev', 'cmtc:dev'):
              image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', tag], text=True))[0]
              assert image['Os'] == 'linux' and image['Architecture'] == 'amd64', image
              images.append({'tag': tag, 'id': image['Id'], 'os': image['Os'], 'architecture': image['Architecture']})
          record = {'source': os.environ['GITHUB_SHA'], 'images': images}
          with open('artifacts/built-images.json', 'w') as output:
              json.dump(record, output, indent=2)
              output.write('\n')
          print(json.dumps(record, indent=2))
          PYIMAGES
      - name: Select an explicit development image bundle
        if: inputs.cilium_image_lock_url != ''
        env:
          LOCK_URL: ${{ inputs.cilium_image_lock_url }}
        run: |
          [[ "$LOCK_URL" =~ ^https://raw[.]githubusercontent[.]com/ephico2real2/(cilium|clustermesh-trust-controller)/[0-9a-f]{40}/ ]] || { echo 'Use an immutable raw file URL in your Cilium fork'; exit 1; }
          mkdir -p .tmp
          curl -fsSL --retry 4 "$LOCK_URL" -o .tmp/cilium-images.override.json
          echo 'CILIUM_IMAGE_LOCK=.tmp/cilium-images.override.json' >> "$GITHUB_ENV"
      - name: Deploy Cilium, intermediate-backed cert-manager mesh, CMTC and monitoring
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/lab/up.sh 2>&1 | tee artifacts/bring-up.log
      - name: Reproduce the imported PoC Hubble app dashboard from the pinned chart
        run: |
          chart=$(cat .tmp/cilium-chart-path)
          python3 examples/observability/hubble-l7-by-app/check.py \
            "$chart/files/hubble/dashboards/hubble-l7-http-metrics-by-workload.json"
      - name: Reconcile policies, exercise imported apps and assert failures
        run: |
          set -o pipefail
          bash scripts/lab/test.sh 2>&1 | tee artifacts/tests.log
      - name: Start six-minute shop and cross-cluster HTTP loads
        id: load
        run: bash scripts/lab/load.sh start
      - name: Real dashboard and example application screenshots
        if: always()
        timeout-minutes: 10
        uses: ./.github/actions/browser-walk
        with:
          load-timeline: ${{ steps.load.outcome == 'success' }}
      - name: Require measured HTTP load results
        if: always() && steps.load.outcome == 'success'
        run: bash scripts/lab/load.sh collect
      - name: Preserve cluster evidence
        if: always()
        run: bash scripts/lab/evidence.sh
      - name: Test summary
        if: always()
        run: |
          {
            echo '## CMTC deployed Observe lab'
            echo 'Policy/inventory, imported application policy, baseline ClusterMesh and screenshots are tested here. Workload mTLS and layered encryption are BLOCKED pending Cilium integration.'
            for report in artifacts/built-images.json artifacts/cilium-images.lock.json artifacts/cilium-image-verification.json artifacts/load-results.json artifacts/results.json; do
              if [ -f "$report" ]; then
                echo '```json'
                cat "$report"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmtc-lab-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Delete only clusters created by this job and remove temporary signing files
        if: always()
        run: bash scripts/lab/down.sh
