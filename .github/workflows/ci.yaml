name: CMTC build and deployed two-cluster lab
on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmtc-${{ github.ref }}
  cancel-in-progress: true
env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.10', cache: true}
      - run: make test build
      - name: Generated schema and formatting stay current
        run: |
          python3 scripts/generate-crd.py
          git diff --exit-code config/crd
          test -z "$(gofmt -l api internal cmd)"
          kubectl kustomize config/default > /tmp/cmtc-manifests.yaml
          bash -n scripts/lab/*.sh
  deployed-lab:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Pinned tools with published checksum verification
        run: bash scripts/lab/ci-bootstrap.sh
      - name: Build Ubuntu capture image with Playwright, Chromium and OS libraries installed
        timeout-minutes: 10
        run: docker build -f scripts/capture/Dockerfile -t cmtc-capture:dev .
      - name: Build the actual CMTC image
        run: docker build -t cmtc:dev .
      - name: Deploy Cilium, intermediate-backed cert-manager mesh, CMTC and monitoring
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/lab/up.sh 2>&1 | tee artifacts/bring-up.log
      - name: Reconcile policies, exercise imported apps and assert failures
        run: |
          set -o pipefail
          bash scripts/lab/test.sh 2>&1 | tee artifacts/tests.log
      - name: Preserve cluster evidence
        if: always()
        run: bash scripts/lab/evidence.sh
      - name: Real dashboard and example application screenshots
        if: always()
        timeout-minutes: 10
        run: bash scripts/lab/capture.sh
      - name: Test summary
        if: always()
        run: |
          echo '## CMTC deployed Observe lab' >> "$GITHUB_STEP_SUMMARY"
          echo 'Policy/inventory, imported application policy, baseline ClusterMesh and screenshots are tested here. Workload mTLS and layered encryption are BLOCKED pending Cilium integration.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/results.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmtc-lab-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Delete only clusters created by this job and remove temporary signing files
        if: always()
        run: bash scripts/lab/down.sh
