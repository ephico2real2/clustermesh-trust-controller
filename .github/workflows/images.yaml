name: CMTC images
# Publishes the two CMTC images for linux/amd64 and linux/arm64 from one source commit:
#   ghcr.io/ephico2real2/cmtc                  the controller Deployment and the node DaemonSet (--mode selects)
#   ghcr.io/ephico2real2/cmtc-spire-registrar  the SPIRE registrar sidecar
# Tags are immutable (sha-<commit>); consumers pin the digests from the images.lock.json artifact.
# workflow_dispatch only runs from the default branch, so a commit not yet on main is published by pushing it to
# ci/images (the convention of the Cilium fork's cmtc-development-images workflow).
on:
  push:
    branches: [main, ci/images]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit of this repository to publish (must be pushed)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cmtc-images-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  REGISTRY: ghcr.io/ephico2real2
jobs:
  publish:
    if: github.repository == 'ephico2real2/clustermesh-trust-controller'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate immutable source
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Checkout the exact image source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to the owned GHCR packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Go cross-compiles in the build stage and both final stages only copy files, so no emulation runs.
      - name: Build and push the CMTC image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: cmtc
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_REVISION=${{ env.SOURCE_SHA }}
          push: true
          tags: ${{ env.REGISTRY }}/cmtc:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/ephico2real2/clustermesh-trust-controller
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=cmtc
          cache-from: type=gha,scope=cmtc-images
          cache-to: type=gha,scope=cmtc-images,mode=max
      - name: Build and push the SPIRE registrar image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: registrar
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_REVISION=${{ env.SOURCE_SHA }}
          push: true
          tags: ${{ env.REGISTRY }}/cmtc-spire-registrar:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/ephico2real2/clustermesh-trust-controller
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.title=cmtc-spire-registrar
          cache-from: type=gha,scope=cmtc-images
          cache-to: type=gha,scope=cmtc-images,mode=max
      - name: Verify the published images and write the lock
        run: |
          set -euo pipefail
          mkdir -p bundle
          for name in cmtc cmtc-spire-registrar; do
            docker buildx imagetools inspect "$REGISTRY/$name:sha-$SOURCE_SHA" --format '{{json .Manifest}}' > "bundle/$name.json"
          done
          python3 - <<'PY'
          import json, os, pathlib
          bundle, sha, registry = pathlib.Path('bundle'), os.environ['SOURCE_SHA'], os.environ['REGISTRY']
          images = {}
          for name in ('cmtc', 'cmtc-spire-registrar'):
              index = json.loads((bundle / f'{name}.json').read_text())
              platforms = sorted(f"{m['platform']['os']}/{m['platform']['architecture']}"
                                 for m in index.get('manifests', []) if m.get('platform', {}).get('os') != 'unknown')
              assert platforms == ['linux/amd64', 'linux/arm64'], (name, platforms)
              images[name] = {'image': f"{registry}/{name}@{index['digest']}", 'tag': f'{registry}/{name}:sha-{sha}'}
          lock = {'source_sha': sha, 'platforms': ['linux/amd64', 'linux/arm64'], 'images': images}
          (bundle / 'images.lock.json').write_text(json.dumps(lock, indent=2) + '\n')
          for name, ref in images.items():
              print(name, ref['image'])
          PY
          # Pull each image by digest on this amd64 runner and check what a deployment relies on.
          cmtc=$(python3 -c 'import json; print(json.load(open("bundle/images.lock.json"))["images"]["cmtc"]["image"])')
          registrar=$(python3 -c 'import json; print(json.load(open("bundle/images.lock.json"))["images"]["cmtc-spire-registrar"]["image"])')
          docker pull -q "$cmtc"; docker pull -q "$registrar"
          check() { [ "$(docker inspect "$1" --format "$2")" = "$3" ] || { echo "$1: $2 is not $3" >&2; exit 1; }; }
          check "$cmtc" '{{.Config.User}} {{json .Config.Entrypoint}}' '65532:65532 ["/cmtc"]'
          check "$registrar" '{{.Config.User}} {{json .Config.Entrypoint}}' '1000:1000 ["/cmtc-spire-registrar"]'
          for image in "$cmtc" "$registrar"; do
            check "$image" '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$SOURCE_SHA"
          done
          [ "$(docker run --rm "$registrar" --version)" = "cmtc-spire-registrar source=$SOURCE_SHA" ]
          cat bundle/images.lock.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the image lock
        uses: actions/upload-artifact@v4
        with:
          name: cmtc-images-${{ env.SOURCE_SHA }}
          path: bundle/
          retention-days: 90
